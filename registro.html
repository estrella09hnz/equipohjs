<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de usuarios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet" href="estilo.css">
</head>

<body>
    <div class="login-card">
        <h2>Crear cuenta</h2>

        <form id="registroForm">

          
            <div class="mb-3">
                <label for="nombre" class="form-label">
                    Nombre 
                </label>
                <input type="text"
                    class="form-control"
                    id="nombre"
                    required>
            </div>
            
              <div class="mb-3">
                <label for="nombre" class="form-label">
                    ApellidoP
                </label>
                <input type="text"
                    class="form-control"
                    id="nombre"
                    required>
            </div>

              <div class="mb-3">
                <label for="nombre" class="form-label">
                    ApellidoM
                </label>
                <input type="text"
                    class="form-control"
                    id="nombre"
                    required>
            </div>

            <div class="mb-3">
                <label for="control" class="form-label">
                    Número de control
                </label>
                <input type="text"
                    class="form-control"
                    id="control"
                    required>
            </div>

            <div class="mb-3">
                <label for="semestre" class="form-label">
                    Semestre
                </label>
                <select class="form-control"
                    id="semestre"
                    required>
                    <option value="">Selecciona tu semestre</option>
                    <option value="1">1°</option>
                    <option value="2">2°</option>
                    <option value="3">3°</option>
                    <option value="4">4°</option>
                    <option value="5">5°</option>
                    <option value="6">6°</option>
                </select>
            </div>

           
            <div class="mb-3">
                <label for="especialidad" class="form-label">
                    Especialidad
                </label>
                <input type="text"
                    class="form-control"
                    id="especialidad"
                    required>
            </div>

           
            <div class="mb-3">
                <label for="turno" class="form-label">
                    Turno
                </label>
                <select class="form-control"
                    id="turno"
                    required>
                    <option value="">Selecciona tu turno</option>
                    <option value="Matutino">Matutino</option>
                    <option value="Vespertino">Vespertino</option>
                </select>
            </div>

           
            <div class="mb-3">
                <label for="password" class="form-label">
                    Contraseña
                </label>

                <input type="password"
                    class="form-control"
                    id="password"
                    minlength="8"
                    required>
            </div>

            
            <div class="mb-3">
                <label for="confirmar" class="form-label">
                    Confirmar contraseña
                </label>

                <input type="password"
                    class="form-control"
                    id="confirmar"
                    minlength="8"
                    required>
            </div>

            <button type="submit"
                class="btn btn-success btn-login">
                Registrarme
            </button>

            <div class="text-center mt-3">
                <a href="login.html">
                    ¿Ya tienes cuenta? Inicia sesión
                </a>
            </div>

        </form>
    </div>

    <script src="registro.js"></script>

</body>
</html>
