<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de materias</title>

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <h1>Andrea ❤️❤️</h1>

    <input
        type="text"
        id="buscador"
        class="buscador"
        placeholder="Buscar un libro..."
        oninput="buscarProductos()"
    >

    <div class="contenedor">

        <div class="producto" data-nombre="ingles">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSL9exyAQ8OVkPN8GcKK-zLoUeoceq17Wjhoh_WFPbOWw&s=10" alt="Inglés">
            <h2>Inglés</h2>
            <p class="precio">$250.00</p>
            <button onclick="agregarCarrito('Inglés', 250)">Agregar al carrito</button>
        </div>

        <div class="producto" data-nombre="matematicas">
            <img src="https://www.libcientifica.com/imagenes/9789709/978970966310.GIF" alt="Matemáticas">
            <h2>Matemáticas</h2>
            <p class="precio">$250.00</p>
            <button onclick="agregarCarrito('Matemáticas', 250)">Agregar al carrito</button>
        </div>

        <div class="producto" data-nombre="la energia">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSe6-Lf7KGU8WPeAqQ8fZ9CLPN7hRQi5EviuDGBMUj_OKmvsU2haBzZHcY&s=10" alt="La energía">
            <h2>La energía</h2>
            <p class="precio">$250.00</p>
            <button onclick="agregarCarrito('La energía', 250)">Agregar al carrito</button>
        </div>

        <div class="producto" data-nombre="conciencia historica">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTvszFkVnZ7c5gTW7e_PWpYkdVrrpQVq11vXVCsJ3HcfhvYNIxtWbwCnxo&s=10" alt="Conciencia histórica">
            <h2>Conciencia histórica</h2>
            <p class="precio">$250.00</p>
            <button onclick="agregarCarrito('Conciencia histórica', 250)">Agregar al carrito</button>
        </div>

        <div class="producto" data-nombre="aplica administracion">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSSp-EmDhaJWjbEfDGzml40f_xjqNZTGJKuQv4L5WQYNgPn3VfIZoUnhvFr&s=10" alt="Aplica administración">
            <h2>Aplica administración</h2>
            <p class="precio">$250.00</p>
            <button onclick="agregarCarrito('Aplica administración', 250)">Agregar al carrito</button>
        </div>

    </div>

    <div id="carrito">

        <h2>Carrito de compras</h2>

        <div id="listaCarrito">
            <p>Tu carrito está vacío.</p>
        </div>

        <h3 id="total">Total: $0.00</h3>

        <button onclick="vaciarCarrito()">Vaciar carrito</button>

    </div>

    <script src="inicio.js"></script>

</body>
</html>
